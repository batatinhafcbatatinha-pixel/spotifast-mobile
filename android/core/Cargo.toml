[package]
name = "spotifast-android"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Spotifast's Rust core for Android: sign-in, Web API and librespot playback, exposed over JNI"
publish = false

# Built on its own, not as part of the desktop crate.
[workspace]

[lib]
name = "spotifast_android"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
# webpki roots: Android's certificate store is not reachable from native code.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "gzip", "http2"] }
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"
jni = "0.21"
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-connect = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-protocol = { version = "0.8", default-features = false }
librespot-metadata = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
# rodio over cpal, which plays through AAudio on Android.
librespot-playback = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots", "rodio-backend"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
# Lets cpal reach the JVM and the application context for audio devices.
ndk-context = "0.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

# The same librespot the desktop app builds with (see the root Cargo.toml for
# what each patch adds): queue controls, audio-key back-off, faster skips.
[patch.crates-io]
librespot-audio = { git = "https://github.com/crmne/librespot", rev = "3ba977f1f918582edce566cfc16617f8eccdfb1e" }
librespot-connect = { git = "https://github.com/crmne/librespot", rev = "3ba977f1f918582edce566cfc16617f8eccdfb1e" }
librespot-core = { git = "https://github.com/crmne/librespot", rev = "3ba977f1f918582edce566cfc16617f8eccdfb1e" }
librespot-metadata = { git = "https://github.com/crmne/librespot", rev = "3ba977f1f918582edce566cfc16617f8eccdfb1e" }
librespot-oauth = { git = "https://github.com/crmne/librespot", rev = "3ba977f1f918582edce566cfc16617f8eccdfb1e" }
librespot-playback = { git = "https://github.com/crmne/librespot", rev = "3ba977f1f918582edce566cfc16617f8eccdfb1e" }
librespot-protocol = { git = "https://github.com/crmne/librespot", rev = "3ba977f1f918582edce566cfc16617f8eccdfb1e" }
hyper-proxy2 = { git = "https://github.com/crmne/hyper-proxy2", rev = "efca4811371ddae81c06be168de54194938d70b1" }
