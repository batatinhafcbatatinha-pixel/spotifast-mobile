# XcodeGen spec: `xcodegen generate` writes Spotifast.xcodeproj.
name: Spotifast
options:
  bundleIdPrefix: io.github.batatinha
  deploymentTarget:
    iOS: "17.0"
targets:
  Spotifast:
    type: application
    platform: iOS
    sources:
      - path: Spotifast
        excludes:
          - Info.plist
    info:
      path: Spotifast/Info.plist
      properties:
        CFBundleDisplayName: Spotifast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.batatinha.spotifast
        PRODUCT_NAME: Spotifast
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Spotifast/Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(PROJECT_DIR)/build/ios
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/build/ios-sim
        OTHER_LDFLAGS: -lspotifast_android -lresolv -lc++
        DEAD_CODE_STRIPPING: YES
    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - sdk: SafariServices.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
